<app-burguer></app-burguer>

<div class="detalle-container" *ngIf="libro">
    <div class="libro-header">
        <div class="portada-wrapper">
            <img [src]="'http://localhost:3600/tener-portada/' + libro.portada" [alt]="libro.titulo">
        </div>

        <div class="info-principal">
            <h1>{{ libro.titulo }}</h1>
            <p class="autor">Por: <strong>{{ libro.autor }}</strong></p>
            <hr>

            <div class="botones-accion">
                <button class="btn btn-leer" (click)="empezarALeer()">
                    <i class="fas fa-book-open"></i> Empezar a Leer
                </button>
                
                <button class="btn btn-favorito" [class.favorito]="esFavorito" (click)="gestionarFavorito()">
                    <i class="fas" [ngClass]="{'fa-heart': esFavorito, 'fa-heart-o': !esFavorito}"></i> 
                    {{ esFavorito ? 'Guardado' : 'Guardar en Favoritos' }}
                </button>
            </div>

            <div *ngIf="mensaje" class="alert mt-3" [ngClass]="{'alert-success': mensaje.includes('añadido') || mensaje.includes('actualizado'), 'alert-danger': mensaje.includes('Error') || mensaje.includes('eliminado')}">
                {{ mensaje }}
            </div>
            
            <div class="datos-rapidos">
                <span><strong>Género:</strong> {{ libro.genero }}</span>
                <span><strong>Publicación:</strong> {{ libro.anio_publicacion }}</span>
                <span><strong>Idioma:</strong> {{ libro.idioma }}</span>
                <span><strong>Disponible:</strong> {{ libro.cantidad_disponible }}</span>
            </div>

        </div>
    </div>

    <div class="descripcion-seccion">
        <h2>Descripción</h2>
        <p>{{ libro.descripcion }}</p>
    </div>
</div>

<div *ngIf="!libro && !mensaje">
    <p class="text-center mt-5">Cargando información del libro...</p>
</div>
