<!-- Botón hamburguesa -->
<button class="hamburger-btn" (click)="toggleSidebar()" [class.active]="isOpen" aria-label="Toggle menu">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
</button>

<!-- Overlay -->
<div class="sidebar-overlay" [class.active]="isOpen" (click)="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" [class.open]="isOpen">
    <br>
    <div class="sidebar-header">
        <h2 class="sidebar-title">Perfil Usuario</h2>
        <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor"
                stroke-width="2">
                <line x1="4" y1="6" x2="24" y2="6"></line>
                <line x1="4" y1="12" x2="24" y2="12"></line>
                <line x1="4" y1="18" x2="24" y2="18"></line>
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">

        <!-- Inicio -->
        <a routerLink="/inicio" class="nav-item" (click)="closeSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Inicio</span>
        </a>

        <!-- Perfil -->
        <a routerLink="usuario/perfil" class="nav-item" (click)="closeSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="12" cy="7" r="4"></circle>
                <path d="M5.5 21a8.38 8.38 0 0 1 13 0"></path>
            </svg>
            <span>Perfil</span>
        </a>

        <!-- Favoritos -->
        <a routerLink="usuario/favorito" class="nav-item" (click)="closeSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" stroke="currentColor"
                stroke-width="2">
                <path
                    d="M20.8 4.6a5.53 5.53 0 0 0-7.8 0L12 5.6l-1-1a5.53 5.53 0 0 0-7.8 7.8L12 22l8.8-8.6a5.53 5.53 0 0 0 0-7.8z">
                </path>
            </svg>
            <span>Favoritos</span>
        </a>

        <!-- Préstamos -->
        <a routerLink="usuario/prestamos" class="nav-item" (click)="closeSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Préstamos</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <button class="logout-btn" (click)="closeSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Cerrar Sesión</span>
        </button>
    </div>
</aside>
