<app-sidebar></app-sidebar>

<div class="container mt-4">
    <!-- Header Section with Title and Add Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold">Gestión de Libros</h2>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#libroModal"
            (click)="abrirModalNuevo()">
            <i class="bi bi-book-half me-2"></i>Registrar Libro
        </button>
    </div>

    <!-- Tabla de Libros -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-journal-album me-2"></i>Lista de Libros</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th class="ps-4">Portada</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Género</th>
                            <th>Año</th>
                            <th>Cantidad</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let libro of listaLibros | slice: (page-1) * pageSize : page * pageSize">
                            <td class="ps-4">
                                <img *ngIf="libro.portada" [src]="url + 'tener-portada/' + libro.portada" alt="Portada"
                                    class="img-thumbnail" style="width: 50px; height: 75px; object-fit: cover;">
                                <span *ngIf="!libro.portada" class="text-muted">Sin imagen</span>
                            </td>
                            <td class="fw">{{ libro.titulo }}</td>
                            <td>{{ libro.autor }}</td>
                            <td>{{ libro.genero }}</td>
                            <td>{{ libro.anio_publicacion }}</td>
                            <td>{{ libro.cantidad_disponible }}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-info btn-action me-2 text-white" data-bs-toggle="modal"
                                    data-bs-target="#libroModal" (click)="abrirModalEditar(libro)">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </button>
                                <button class="btn btn-sm btn-danger btn-action" data-bs-toggle="modal"
                                    data-bs-target="#deleteModal" (click)="abrirModalEliminar(libro._id, libro)">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Controles para cambiar de páginas -->
            <div class="d-flex justify-content-center p-3" *ngIf="listaLibros.length > pageSize">
                <nav aria-label="Page navigation">
                    <ul class="pagination mb-0">
                        <li class="page-item" [class.disabled]="page === 1">
                            <a class="page-link" href="javascript:void(0)" (click)="page = page - 1"
                                aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li class="page-item disabled">
                            <!--Muestra en qué página está el usuario y cuántas páginas existen en total.
                                La clase 'page-link' es solo para darle estilo de Bootstrap (botón de para el bloue de páginas).
                            -->

                            <!-- Muestra la página actual en la que se encuentra 'page'
                              es la variable del componente TypeScript que indica en qué página está el usuario.
                            -->

                            <!--El  {{ Math.ceil(listaLibros.length / pageSize) }} 
                                Calcula el total de páginas dividiendo:
                                - listaLibros.length = cantidad total de libros
                                - pageSize = cuántos libros se muestran por página

                            Se usa Math.ceil() para redondear hacia arriba.
                            Ejemplo:
                            Si hay 23 libros y pageSize = 10 → 23/10 = 2.3 → ceil = 3 páginas totales
                            -->
                            <span class="page-link">Página {{page}} de {{ Math.ceil(listaLibros.length / pageSize)
                                }}</span>

                        </li>
                        <li class="page-item" [class.disabled]="page >= listaLibros.length / pageSize">
                            <a class="page-link" href="javascript:void(0)" (click)="page = page + 1" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<app-m-add-edit-lib (libroGuardado)="obtenerLibros()"></app-m-add-edit-lib>
<app-m-delete-lib (libroEliminado)="obtenerLibros()"></app-m-delete-lib>
