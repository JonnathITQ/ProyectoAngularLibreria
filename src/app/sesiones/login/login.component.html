<a routerLink="/seleccionar" class="btn-regresar">Regresar</a>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Iniciar Sesión - Empleado</h3>
                    <small>Acceso para Empleados</small>
                </div>
                <div class="card-body">
                    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" #correo="ngModel"
                                [(ngModel)]="empleado.correo" required>
                            <div *ngIf="correo.invalid && (correo.dirty || correo.touched)" class="text-danger">
                                El correo es obligatorio.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasenia" name="contrasenia"
                                #contrasenia="ngModel" [(ngModel)]="empleado.contrasenia" required>
                            <div *ngIf="contrasenia.invalid && (contrasenia.dirty || contrasenia.touched)"
                                class="text-danger">
                                La contraseña es obligatoria.
                            </div>
                        </div>

                        <div *ngIf="status === 'failed'" class="alert alert-danger">
                            Error al iniciar sesión. Verifica tus credenciales.
                        </div>

                        <button type="submit" class="btn btn-primary w-100"
                            [disabled]="loginForm.invalid">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
