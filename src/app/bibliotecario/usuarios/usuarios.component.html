<div class="d-flex">
    <app-sidebar></app-sidebar>

    <div class="content p-4 w-100 container">
        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Gestión de Usuarios</h2>
                <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#userModal"
                    (click)="abrirModalNuevo()">
                    <i class="bi bi-person-plus-fill me-2"></i>Registrar Usuario
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Cédula</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let user of listaUsuarios">
                            <td>
                                <div class="fw-bold">{{ user.nombre }}</div>
                            </td>
                            <td>{{ user.apellido }}</td>
                            <td>{{ user.cedula }}</td>
                            <td>{{ user.correo }}</td>
                            <td>
                                <button class="btn btn-sm btn-info btn-action me-2 text-white" data-bs-toggle="modal"
                                    data-bs-target="#userModal" (click)="abrirModalEditar(user)" title="Editar">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </button>
                                <button class="btn btn-sm btn-danger btn-action" data-bs-toggle="modal"
                                    data-bs-target="#deleteModal" (click)="abrirModalEliminar(user._id, user)"
                                    title="Eliminar">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<app-m-add-edit-us (usuarioGuardado)="obtenerUsuarios()"></app-m-add-edit-us>
<app-m-delete-us (usuarioEliminado)="obtenerUsuarios()"></app-m-delete-us>
