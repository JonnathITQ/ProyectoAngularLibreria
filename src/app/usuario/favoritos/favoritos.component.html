<app-sidebar></app-sidebar>

<div class="favoritos-container">
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="content-wrapper">
        <div class="header-section">
            <div class="title-wrapper">
                <h2>Mis Libros Favoritos</h2>
                <p>Tu colección personal de lecturas amadas</p>
            </div>
            <button class="manage-btn" (click)="toggleModal()">
                <span class="btn-icon">+</span>
                Gestionar Favoritos
            </button>
        </div>

        <!-- Carousel de Favoritos -->
        <app-carousel-favoritos [libros]="librosFavoritos" (remove)="eliminarFavorito($event)"
            (openModal)="toggleModal()">
        </app-carousel-favoritos>
    </div>

    <!-- Modal de Selección -->
    <app-modal-seleccion [isVisible]="showModal" [todosLibros]="todosLibros" [librosFavoritos]="librosFavoritos"
        (close)="toggleModal()" (save)="guardarCambios()">
    </app-modal-seleccion>
</div>
