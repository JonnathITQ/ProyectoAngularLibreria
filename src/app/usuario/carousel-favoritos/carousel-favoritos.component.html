<!-- Carousel de Favoritos -->
<div class="carousel-section" *ngIf="libros.length > 0">
    <div class="carousel-grid">
        <div class="book-card" *ngFor="let libro of libros">
            <div class="book-cover-wrapper">
                <img [src]="libro.portada" [alt]="libro.titulo" class="book-cover">
                <div class="book-overlay">
                    <button class="remove-btn" (click)="onRemove(libro)" title="Eliminar de favoritos">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="book-info">
                <h4>{{ libro.titulo }}</h4>
                <p>{{ libro.autor }}</p>
            </div>
        </div>
    </div>
</div>

<div class="empty-state" *ngIf="libros.length === 0">
    <div class="empty-icon">📚</div>
    <h3>Tu colección está vacía</h3>
    <p>Comienza a agregar los libros que más te gusten</p>
    <button class="manage-btn-large" (click)="onOpenModal()">
        Explorar Libros
    </button>
</div>
