<div class="modal-overlay" *ngIf="isVisible" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>Gestionar Favoritos</h3>
            <button class="close-modal" (click)="closeModal()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="modal-body">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="search-icon">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <select id="libroSelect" [(ngModel)]="libroSeleccionado" (change)="onLibroSelect()"
                        class="custom-select">
                        <option [ngValue]="null" disabled selected>Buscar un libro...</option>
                        <option *ngFor="let libro of todosLibros" [ngValue]="libro">
                            {{ libro.titulo }} - {{ libro.autor }}
                        </option>
                    </select>
                </div>
            </div>

            <div class="preview-section" *ngIf="libroSeleccionado">
                <div class="preview-card">
                    <div class="preview-image">
                        <img [src]="libroSeleccionado.portada" [alt]="libroSeleccionado.titulo">
                    </div>
                    <div class="preview-info">
                        <div class="preview-header">
                            <h4>{{ libroSeleccionado.titulo }}</h4>
                            <span class="author-badge">{{ libroSeleccionado.autor }}</span>
                        </div>
                        <p class="description">{{ libroSeleccionado.descripcion }}</p>

                        <button class="action-btn" [class.added]="esFavorito(libroSeleccionado)"
                            (click)="toggleFavorito(libroSeleccionado)">
                            <span *ngIf="!esFavorito(libroSeleccionado)">Agregar a Favoritos</span>
                            <span *ngIf="esFavorito(libroSeleccionado)">Quitar de Favoritos</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="done-btn" (click)="saveChanges()">Guardar Cambios</button>
        </div>
    </div>
</div>
