<app-burguer></app-burguer>

<div class="perfil-container">
    <header class="perfil-header">
        <h1>Perfil del Usuario</h1>
        <p>Aquí puedes visualizar y actualizar tu información personal.</p>
    </header>

    <div class="perfil-card">
        <h2>Información Personal</h2>

        <form class="perfil-form">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" [(ngModel)]="usuario.nombre" name="nombre">
            </div>

            <div class="form-group">
                <label>Apellido</label>
                <input type="text" [(ngModel)]="usuario.apellido" name="apellido">
            </div>

            <div class="form-group">
                <label>Cédula</label>
                <input type="text" [value]="usuario.cedula" disabled>
            </div>

            <div class="form-group">
                <label>Correo</label>
                <input type="email" [(ngModel)]="usuario.correo" name="correo">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="text" [value]="usuario.passwordHash" disabled>
            </div>

            <div class="botones">
                <button type="button" class="btn btn-datos" (click)="editarDatos()">
                    Editar Datos
                </button>

                <button type="button" class="btn btn-pass" (click)="cambiarPassword()">
                    Cambiar Contraseña
                </button>
            </div>

        </form>
    </div>
</div>
