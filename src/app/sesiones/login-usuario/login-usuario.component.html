<a routerLink="/seleccionar" class="btn-regresar">Regresar</a>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Iniciar Sesión - Usuario</h3>
                    <small>Acceso para lectores</small>
                </div>
                <div class="card-body">
                    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" #correo="ngModel"
                                [(ngModel)]="usuario.correo" required>
                        </div>
                        <div class="mb-3">
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasenia" name="contrasenia"
                                #contrasenia="ngModel" [(ngModel)]="usuario.contrasenia" required>
                        </div>

                        <div *ngIf="status === 'failed'" class="alert alert-danger">
                            Error al iniciar sesión. Verifica tus credenciales.
                        </div>

                        <button type="submit" class="btn btn-primary w-100"
                            [disabled]="loginForm.invalid">Ingresar</button>

                        <div class="mt-3 text-center">
                            <a [routerLink]="['/registrar']">¿No tienes cuenta? Registrate</a>
                        </div>
                        <div class="mt-3 text-center">
                            <a [routerLink]="['/recuperar']">¿Olvidaste tu contraseña?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
